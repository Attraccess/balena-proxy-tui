[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "balena-proxy-tui"
version = "0.1.0"
description = "Temporary local access to an Attraccess balena device"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["rich>=13.7,<15", "pyte>=0.8.2,<0.9"]

[project.scripts]
balena-proxy-tui = "attraccess_tunnel.cli:main"
attraccess-tunnel = "attraccess_tunnel.cli:main"

[project.urls]
Homepage = "https://github.com/Attraccess/balena-proxy-tui"
Issues = "https://github.com/Attraccess/balena-proxy-tui/issues"

[tool.setuptools.packages.find]
where = ["src"]
